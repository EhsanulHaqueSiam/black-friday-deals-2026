# Builds the directory on every pull request (validates submissions) and once a day on main
# (pulls the latest community lists, drops expired deals, republishes the site).
name: build
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: directory-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/build.ts ${{ github.event_name == 'schedule' && '--fetch' || '' }}
      - name: Commit rebuilt site
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "chore: rebuild directory" && git push)
      - name: Deploy to Cloudflare Pages (primary site)
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d9736ec134497bdcb2b8f57ed86f6223
        run: node scripts/cf.ts && npx -y wrangler@4 pages deploy dist --project-name bf26-deals --branch main --commit-dirty=true
      - name: Tell search engines (IndexNow)
        if: github.event_name != 'pull_request'
        run: node scripts/indexnow.ts || true
